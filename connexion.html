<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProForm — Connexion</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { min-height:100vh; display:flex; flex-direction:column; background:var(--black); }
    .login-page { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; position:relative; overflow:hidden; }
    .login-page::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 30% 40%, rgba(201,168,76,0.07) 0%, transparent 55%), radial-gradient(ellipse at 75% 70%, rgba(100,50,200,0.06) 0%, transparent 55%); }
    .login-card { background:var(--dark-card); border:1px solid var(--dark-border); border-radius:24px; padding:48px 44px; width:100%; max-width:460px; position:relative; z-index:1; box-shadow:0 40px 100px rgba(0,0,0,0.5); }
    .login-logo { display:flex; align-items:center; gap:10px; margin-bottom:32px; justify-content:center; }
    .login-logo-text { font-family:'Playfair Display',serif; font-size:1.6rem; font-weight:900; }
    .login-logo-text span { background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .login-title { font-family:'Playfair Display',serif; font-size:1.8rem; font-weight:700; text-align:center; margin-bottom:6px; }
    .login-sub { text-align:center; color:var(--gray); font-size:.9rem; margin-bottom:28px; }
    .form-group { margin-bottom:18px; }
    .form-label { display:block; font-size:.8rem; font-weight:600; color:rgba(255,255,255,.7); margin-bottom:7px; }
    .form-input { width:100%; background:rgba(255,255,255,.04); border:1.5px solid var(--dark-border); border-radius:10px; padding:12px 16px; font-size:.92rem; color:#fff; font-family:'Inter',sans-serif; box-sizing:border-box; transition:border-color .25s; }
    .form-input:focus { outline:none; border-color:var(--gold-dark); box-shadow:0 0 0 3px rgba(201,168,76,.12); }
    .disc-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
    .disc-option { position:relative; }
    .disc-option input[type=radio] { position:absolute; opacity:0; width:0; height:0; }
    .disc-btn { display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 10px; background:rgba(255,255,255,.03); border:1.5px solid var(--dark-border); border-radius:12px; cursor:pointer; transition:all .25s; text-align:center; }
    .disc-btn:hover { border-color:rgba(201,168,76,.4); background:rgba(201,168,76,.04); }
    .disc-option input:checked + .disc-btn { border-color:var(--gold); background:rgba(201,168,76,.1); box-shadow:0 0 0 2px rgba(201,168,76,.2); }
    .disc-icon { font-size:1.8rem; line-height:1; }
    .disc-name { font-size:.78rem; font-weight:600; color:rgba(255,255,255,.85); }
    .disc-hint { font-size:.73rem; color:var(--gray); text-align:center; margin-bottom:12px; }
    .pw-wrap { position:relative; }
    .pw-eye { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--gray); cursor:pointer; font-size:.9rem; }
    .login-btn { width:100%; background:var(--gradient); border:none; border-radius:10px; padding:14px; font-size:1rem; font-weight:700; color:#000; font-family:'Inter',sans-serif; cursor:pointer; margin-top:8px; transition:opacity .2s; }
    .login-btn:hover { opacity:.88; }
    .login-btn:disabled { opacity:.5; cursor:not-allowed; }
    .err-box { background:rgba(220,50,50,.1); border:1px solid rgba(220,50,50,.3); border-radius:8px; padding:10px 14px; color:#ff7070; font-size:.83rem; margin-bottom:16px; display:none; }
    .err-box.show { display:block; }
    .ok-box { background:rgba(50,200,50,.1); border:1px solid rgba(50,200,50,.3); border-radius:8px; padding:10px 14px; color:#70ff70; font-size:.83rem; margin-bottom:16px; display:none; }
    .ok-box.show { display:block; }
    .divider { text-align:center; color:var(--gray); font-size:.8rem; margin:18px 0; position:relative; }
    .divider::before,.divider::after { content:''; position:absolute; top:50%; width:42%; height:1px; background:var(--dark-border); }
    .divider::before { left:0; } .divider::after { right:0; }
    .register-link { text-align:center; font-size:.85rem; color:var(--gray); }
    .register-link a { color:var(--gold); text-decoration:none; font-weight:600; }
    @media(max-width:500px){ .login-card{ padding:32px 20px; } }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <svg width="26" height="26" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
      <polygon points="13,1.5 23.1,7.5 23.1,18.5 13,24.5 2.9,18.5 2.9,7.5" fill="rgba(201,168,76,0.12)" stroke="#C9A84C" stroke-width="1.5"/>
      <text x="13" y="17.5" text-anchor="middle" font-size="9.5" font-weight="900" fill="#C9A84C" font-family="Georgia,serif">PF</text>
    </svg>
    PRO<span>FORM</span>
  </a>
  <ul class="nav-menu">
    <li><a href="index.html" style="color:var(--gray);font-size:.85rem;text-decoration:none;">← Retour à l'accueil</a></li>
  </ul>
</nav>

<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <svg width="32" height="32" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
        <polygon points="13,1.5 23.1,7.5 23.1,18.5 13,24.5 2.9,18.5 2.9,7.5" fill="rgba(201,168,76,0.15)" stroke="#C9A84C" stroke-width="1.5"/>
        <text x="13" y="17.5" text-anchor="middle" font-size="9.5" font-weight="900" fill="#C9A84C" font-family="Georgia,serif">PF</text>
      </svg>
      <div class="login-logo-text">PRO<span>FORM</span></div>
    </div>

    <h1 class="login-title">Connexion</h1>
    <p class="login-sub">Accédez à vos formations personnalisées</p>

    <div class="err-box" id="errBox"></div>
    <div class="ok-box"  id="okBox"></div>

    <form id="loginForm">

      <div class="form-group">
        <label class="form-label" for="fEmail">Adresse email</label>
        <input class="form-input" type="email" id="fEmail" placeholder="votre@email.com" required />
      </div>

      <div class="form-group">
        <label class="form-label">Votre discipline artistique</label>
        <div class="disc-grid">
          <label class="disc-option">
            <input type="radio" name="disc" value="scene" />
            <div class="disc-btn"><span class="disc-icon">🎭</span><span class="disc-name">Scène & Théâtre</span></div>
          </label>
          <label class="disc-option">
            <input type="radio" name="disc" value="cinema" />
            <div class="disc-btn"><span class="disc-icon">🎬</span><span class="disc-name">Cinéma</span></div>
          </label>
          <label class="disc-option">
            <input type="radio" name="disc" value="art-plastique" />
            <div class="disc-btn"><span class="disc-icon">🎨</span><span class="disc-name">Art Plastique</span></div>
          </label>
          <label class="disc-option">
            <input type="radio" name="disc" value="musique" />
            <div class="disc-btn"><span class="disc-icon">🎵</span><span class="disc-name">Musique</span></div>
          </label>
        </div>
        <p class="disc-hint">Sélectionnez pour aller directement à vos cours</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="fPassword">Mot de passe</label>
        <div class="pw-wrap">
          <input class="form-input" type="password" id="fPassword" placeholder="••••••••" required />
          <button type="button" class="pw-eye" id="eyeBtn">👁</button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="submitBtn">Se connecter →</button>
    </form>

    <div class="divider">ou</div>
    <p class="register-link">Pas encore de compte ? <a href="index.html">S'inscrire gratuitement</a></p>
  </div>
</div>

<script>
  const API = 'https://proform-backend.onrender.com';

  const DISC_DEST = {
    'scene':         'sceneformation.html',
    'cinema':        'cinemaformation.html',
    'art-plastique': 'art-plastiqueformation.html',
    'musique':       'musiqueformation.html'
  };

  /* Toggle password visibility */
  document.getElementById('eyeBtn').addEventListener('click', function(){
    const f = document.getElementById('fPassword');
    f.type = f.type === 'password' ? 'text' : 'password';
  });

  function showErr(msg) {
    document.getElementById('errBox').textContent = msg;
    document.getElementById('errBox').classList.add('show');
    document.getElementById('okBox').classList.remove('show');
  }
  function showOk(msg) {
    document.getElementById('okBox').textContent = msg;
    document.getElementById('okBox').classList.add('show');
    document.getElementById('errBox').classList.remove('show');
  }
  function clearMsg() {
    document.getElementById('errBox').classList.remove('show');
    document.getElementById('okBox').classList.remove('show');
  }

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    clearMsg();

    const email    = document.getElementById('fEmail').value.trim();
    const password = document.getElementById('fPassword').value;
    const btn      = document.getElementById('submitBtn');

    if (!email || !password) {
      showErr('Veuillez remplir votre email et mot de passe.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Connexion en cours…';

    try {
      const res  = await fetch(API + '/api/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (res.ok && data.token) {
        /* Stocker les infos */
        localStorage.setItem('proform_token', data.token);
        localStorage.setItem('proform_user',  JSON.stringify(data.user || {}));

        showOk('Connexion réussie ! Redirection…');

        /* Déterminer la destination */
        const selectedDisc = (document.querySelector('input[name="disc"]:checked')?.value || '').trim();
        const accountDisc  = ((data.user?.discipline) || '').toLowerCase().trim();
        const disc         = selectedDisc || accountDisc;

        setTimeout(function() {
          if (data.user?.role === 'admin') {
            window.location.href = 'admin.html';
            return;
          }
          window.location.href = DISC_DEST[disc] || 'mesformations.html';
        }, 800);

      } else {
        showErr(data.message || 'Email ou mot de passe incorrect.');
        btn.disabled = false;
        btn.textContent = 'Se connecter →';
      }

    } catch (err) {
      showErr('Impossible de joindre le serveur. Vérifiez que le serveur est démarré (port 5000).');
      btn.disabled = false;
      btn.textContent = 'Se connecter →';
    }
  });
</script>
</body>
</html>
